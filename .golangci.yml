run:
  timeout: 5m

linters:
  disable-all: true
  enable:
    - govet
    - ineffassign
    - unused
    - errcheck
    - staticcheck
    - gosec
    - nilerr
    - misspell

linters-settings:
  errcheck:
    check-type-assertions: true
  gosec:
    excludes:
      - G204
  misspell:
    locale: US

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - errcheck
