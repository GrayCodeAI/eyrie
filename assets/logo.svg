<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" width="480" height="160">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0f0f1a"/>
    </linearGradient>
    <!-- Rock/cliff gradient -->
    <linearGradient id="rockGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a4a5a"/>
      <stop offset="100%" style="stop-color:#2a2a38"/>
    </linearGradient>
    <!-- Nest gradient - warm browns -->
    <linearGradient id="nestGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B6914"/>
      <stop offset="100%" style="stop-color:#5A3E0C"/>
    </linearGradient>
    <!-- Egg glow -->
    <radialGradient id="eggGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" style="stop-color:#4ECDC4" stop-opacity="0.9"/>
      <stop offset="60%" style="stop-color:#2a9d8f"/>
      <stop offset="100%" style="stop-color:#1a6b60"/>
    </radialGradient>
    <!-- Teal glow filter -->
    <filter id="tealGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="eggGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Cliff edge shadow -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="480" height="160" fill="url(#bg)" rx="8"/>
  <!-- Border -->
  <rect width="480" height="160" fill="none" stroke="#e05555" stroke-width="1" rx="8" opacity="0.6"/>

  <!-- ═══ CLIFF / ROCK LEDGE ═══ -->
  <!-- Main cliff face -->
  <path d="M 0 160 L 0 90 Q 10 85 20 88 Q 30 80 40 82 Q 55 75 65 78 Q 75 72 85 76 Q 95 70 105 74 Q 115 68 125 72 L 130 160 Z" fill="url(#rockGrad)" filter="url(#shadow)"/>
  <!-- Rock texture lines -->
  <path d="M 15 100 Q 25 95 35 98" stroke="#5a5a6a" stroke-width="0.8" fill="none" opacity="0.5"/>
  <path d="M 20 112 Q 35 108 50 110" stroke="#5a5a6a" stroke-width="0.8" fill="none" opacity="0.4"/>
  <path d="M 10 125 Q 30 120 55 123" stroke="#5a5a6a" stroke-width="0.8" fill="none" opacity="0.4"/>
  <path d="M 60 90 Q 75 86 90 89" stroke="#5a5a6a" stroke-width="0.7" fill="none" opacity="0.4"/>
  <path d="M 70 105 Q 85 101 100 104" stroke="#5a5a6a" stroke-width="0.7" fill="none" opacity="0.3"/>
  <!-- Cliff highlight edge -->
  <path d="M 0 90 Q 10 85 20 88 Q 30 80 40 82 Q 55 75 65 78 Q 75 72 85 76 Q 95 70 105 74 Q 115 68 125 72" stroke="#6a6a7a" stroke-width="1.2" fill="none" opacity="0.6"/>

  <!-- ═══ NEST ═══ -->
  <!-- Nest base - woven twigs -->
  <ellipse cx="80" cy="74" rx="42" ry="12" fill="#3D2B08" opacity="0.8"/>
  <!-- Twig layers -->
  <path d="M 42 74 Q 55 68 68 72 Q 80 66 92 70 Q 104 66 118 72" stroke="#6B4F10" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 44 70 Q 58 64 72 68 Q 84 62 96 66 Q 108 62 116 68" stroke="#8B6914" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 46 66 Q 60 60 74 64 Q 86 58 98 62 Q 110 58 118 64" stroke="#7A5C18" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <!-- Cross twigs -->
  <path d="M 50 78 Q 60 62 70 78" stroke="#5A3E0C" stroke-width="1.5" fill="none" opacity="0.7"/>
  <path d="M 65 80 Q 75 63 85 80" stroke="#5A3E0C" stroke-width="1.5" fill="none" opacity="0.7"/>
  <path d="M 82 79 Q 92 63 102 79" stroke="#5A3E0C" stroke-width="1.5" fill="none" opacity="0.7"/>
  <path d="M 96 78 Q 106 64 116 78" stroke="#5A3E0C" stroke-width="1.5" fill="none" opacity="0.6"/>
  <!-- Nest inner bowl -->
  <ellipse cx="80" cy="68" rx="30" ry="8" fill="#2D1F08" opacity="0.9"/>
  <!-- Soft lining -->
  <ellipse cx="80" cy="67" rx="24" ry="6" fill="#3D2B10" opacity="0.6"/>

  <!-- ═══ GLOWING EGGS ═══ -->
  <!-- Three eggs in nest, center one glowing teal (the "active" one) -->
  <!-- Left egg -->
  <ellipse cx="65" cy="63" rx="9" ry="7" fill="#2a9d8f" opacity="0.5" transform="rotate(-15 65 63)"/>
  <ellipse cx="65" cy="63" rx="8" ry="6" fill="#1a6b60" opacity="0.7" transform="rotate(-15 65 63)"/>
  <ellipse cx="63" cy="61" rx="3" ry="2" fill="#4ECDC4" opacity="0.3" transform="rotate(-15 63 61)"/>

  <!-- Right egg -->
  <ellipse cx="96" cy="63" rx="9" ry="7" fill="#2a9d8f" opacity="0.5" transform="rotate(15 96 63)"/>
  <ellipse cx="96" cy="63" rx="8" ry="6" fill="#1a6b60" opacity="0.7" transform="rotate(15 96 63)"/>
  <ellipse cx="94" cy="61" rx="3" ry="2" fill="#4ECDC4" opacity="0.3" transform="rotate(15 94 61)"/>

  <!-- Center egg - glowing bright teal (the special one) -->
  <ellipse cx="80" cy="58" rx="12" ry="9" fill="#4ECDC4" opacity="0.15" filter="url(#eggGlow)"/>
  <ellipse cx="80" cy="58" rx="11" ry="8.5" fill="url(#eggGrad)" filter="url(#eggGlow)"/>
  <ellipse cx="77" cy="55" rx="4" ry="3" fill="#a0f0ea" opacity="0.4"/>
  <!-- Egg crack lines - hatching -->
  <path d="M 80 51 L 78 55 L 82 57 L 79 62" stroke="#1a6b60" stroke-width="0.8" fill="none" opacity="0.6"/>
  <path d="M 83 53 L 81 56" stroke="#1a6b60" stroke-width="0.7" fill="none" opacity="0.5"/>

  <!-- ═══ STARS / NIGHT SKY ═══ -->
  <circle cx="160" cy="15" r="1" fill="white" opacity="0.6"/>
  <circle cx="145" cy="25" r="0.8" fill="white" opacity="0.4"/>
  <circle cx="170" cy="30" r="0.7" fill="white" opacity="0.5"/>
  <circle cx="135" cy="12" r="1.2" fill="white" opacity="0.5"/>
  <circle cx="155" cy="40" r="0.6" fill="white" opacity="0.3"/>

  <!-- ═══ TEXT ═══ -->
  <!-- "Eyrie" wordmark -->
  <text x="175" y="75" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', monospace" font-size="52" font-weight="700" fill="#4ECDC4" filter="url(#softGlow)" letter-spacing="-1">Eyrie</text>

  <!-- Tagline -->
  <text x="176" y="100" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#8892a4" letter-spacing="0.5">Universal LLM provider library</text>

  <!-- Divider -->
  <line x1="176" y1="110" x2="440" y2="110" stroke="#e05555" stroke-width="0.8" opacity="0.6"/>

  <!-- Sub-tagline -->
  <text x="176" y="128" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" fill="#4ECDC4" opacity="0.7" letter-spacing="1">the foundation layer for hawk</text>

  <!-- Version badge -->
  <rect x="176" y="138" width="52" height="16" rx="3" fill="#e05555" opacity="0.15"/>
  <rect x="176" y="138" width="52" height="16" rx="3" fill="none" stroke="#e05555" stroke-width="0.8" opacity="0.5"/>
  <text x="202" y="150" font-family="'SF Mono', monospace" font-size="9" fill="#e05555" text-anchor="middle" opacity="0.9">v0.0.1</text>
</svg>
